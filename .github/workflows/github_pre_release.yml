# Historical automated publishing was replaced by native build validation.
# Publishing/signing a new release requires explicit release configuration.
name: Manual native release build
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: ./.github/actions/setup-android
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew :app:assembleRelease
      - uses: actions/upload-artifact@v5
        with:
          name: native-release-unsigned
          path: app/build/outputs/apk/release/*.apk
