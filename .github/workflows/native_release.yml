name: Publish native preview
on:
  push:
    tags:
      - 'v*-native'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing native preview tag
        required: true
        default: v0.1.2-native
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: ./.github/actions/setup-android
      - uses: gradle/actions/setup-gradle@v5
      - name: Build and verify
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleRelease
      - name: Sign preview with development certificate
        shell: bash
        run: |
          set -euo pipefail
          preview="app/build/outputs/apk/release/barmural-${RELEASE_TAG#v}-preview.apk"
          preview_key="$RUNNER_TEMP/barmural-preview.p12"
          keytool -genkeypair -noprompt -storetype PKCS12 \
            -keystore "$preview_key" -storepass android -keypass android \
            -alias barmural-preview -keyalg RSA -keysize 3072 -validity 3650 \
            -dname "CN=BarMural Development Preview,O=BarMural,C=BR"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$preview_key" --ks-key-alias barmural-preview \
            --ks-pass pass:android --key-pass pass:android \
            --out "$preview" app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$preview"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 "$preview"
          sha256sum "$preview" > "$preview.sha256"
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes="docs/releases/${RELEASE_TAG}.md"
          test -f "$notes"
          preview="app/build/outputs/apk/release/barmural-${RELEASE_TAG#v}-preview.apk"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$preview" "$preview.sha256" \
              app/build/outputs/apk/release/app-release-unsigned.apk --clobber
          else
            gh release create "$RELEASE_TAG" --verify-tag --prerelease \
              --title "BarMural ${RELEASE_TAG} — prévia nativa" --notes-file "$notes" \
              "$preview" "$preview.sha256" app/build/outputs/apk/release/app-release-unsigned.apk
          fi
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: native-preview-reports
          path: app/build/reports/
